# NeMo Agent Toolkit workflow.
#   aiq run --config_file app/agent/workflow.yml --input "Which vehicles are unsafe to release?"
#
# The LLM here only plans and narrates. Every figure it reports comes from a tool,
# which computes it in Python from the event log.

general:
  use_uvloop: true

llms:
  nemotron:
    # asoia_nim_toolshim, not nim. Asked with the OpenAI `tools` array this
    # NIM returns the call as assistant TEXT with no tool_calls field, so the
    # agent saw no call to make and handed the JSON back as its answer. The
    # provider registered in app/agent/nat_functions.py lifts it back out.
    _type: asoia_nim_toolshim
    model_name: nvidia/llama-3.1-nemotron-nano-8b-v1
    base_url: http://localhost:8000/v1      # self-hosted NIM
    # 0.0, not 0.2. Choosing between ten tools is a classification, and at 0.2
    # the safety question picked list_ros on one run and detect_anomalies on
    # the next - from an identical prompt.
    temperature: 0.0
    max_tokens: 700

embedders:
  nv_embed:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    base_url: http://localhost:8001/v1

# One entry per tool. The toolkit registers one function type per tool -
# `asoia_<tool>` - because a single type cannot expose ten of them; see
# app/agent/nat_functions.py.
functions:
  get_ro_state:            {_type: asoia_get_ro_state}
  get_ro_timeline:         {_type: asoia_get_ro_timeline}
  list_ros:                {_type: asoia_list_ros}
  get_technician_activity: {_type: asoia_get_technician_activity}
  generate_handover:       {_type: asoia_generate_handover}
  detect_anomalies:        {_type: asoia_detect_anomalies}
  diff_ro:                 {_type: asoia_diff_ro}
  search_updates:          {_type: asoia_search_updates}
  get_op_code_info:        {_type: asoia_get_op_code_info}
  get_shift_activity:      {_type: asoia_get_shift_activity}

workflow:
  # tool_calling_agent, not react_agent. ReAct asks the model to produce a text
  # protocol and to stop by writing "Final Answer"; on a search payload - a page
  # of technician prose - the 8B kept narrating instead of emitting the stop
  # token, and exhausted the loop budget at 10 steps and again at 26. It never
  # failed to call the tool; it failed to end the transcript. Native function
  # calling is the mechanism this project's own router already uses, and it
  # takes the workflow from five of six question classes to six of six.
  _type: tool_calling_agent
  llm_name: nemotron
  tool_names: [get_ro_state, get_ro_timeline, list_ros,
               get_technician_activity, generate_handover, detect_anomalies,
               diff_ro, search_updates, get_op_code_info, get_shift_activity]
  max_iterations: 12
  verbose: true
  system_prompt: |
    You are a service operations assistant for a vehicle workshop.

    Answer from TOOL RESULTS ONLY. Never state a number, date, state or name
    that is not in the tool results. Cite the repair order numbers and update
    ids you used, in square brackets.

    Lead with what needs action: safety items first, then breached promises,
    then at-risk, then blocked work.

    You may report and advise. You must NEVER authorise work, order parts,
    approve chargeable repairs, or close a repair order - only a person does
    that. Write in plain British English.

    Call a tool when you need shop data. When the tools have answered the
    question, reply with the answer and stop.

    Write that answer as plain prose. Never wrap it in JSON, and never read the
    payload back field by field.

    If a tool result carries "truncated", it did not fit - say how many of how
    many you are describing, and never present the part as the whole.

    Call one tool, then answer. Never call the same tool twice with the same
    arguments: once it has returned, the answer is in what it returned, or it
    is not there at all and you should say so.

    A result of {"repeat_call": true} is not news and is never part of an
    answer. It means you already have what you asked for: write the answer now,
    from the earlier result.
